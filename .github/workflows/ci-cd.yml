name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Obtener código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Instalar dependencias del sitio
        run: npm ci

      - name: Construir sitio público
        run: npm run build

      - name: Revisar HTML con HTMLHint
        run: npm run lint:html

      - name: Instalar dependencias de API
        working-directory: api
        run: npm ci

      - name: Revisar API con ESLint
        working-directory: api
        run: npm run lint

      - name: Revisar Dockerfiles con Hadolint
        run: |
          for file in api/Dockerfile web/Dockerfile db/Dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.12.0-alpine < "$file"
          done

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site/

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Obtener codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Instalar dependencias del sitio
        run: npm ci

      - name: Construir sitio para pruebas
        run: npm run build

      - name: Ejecutar Vitest
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-report.json

      - name: Instalar dependencias de API
        working-directory: api
        run: npm ci

      - name: Ejecutar pruebas de API
        working-directory: api
        run: npm test -- --json --outputFile=jest-report.json

      - name: Resumen de pruebas
        if: always()
        run: node scripts/resumen-pruebas.mjs

  package:
    name: package
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Obtener codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Autenticarse en GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Construir y publicar imagenes
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${SOURCE_SHA:0:7}"

          WEB="ghcr.io/${OWNER}/perfil-web:${TAG}"
          API="ghcr.io/${OWNER}/perfil-api:${TAG}"

          echo "Publicando version ${TAG}"

          docker build \
            -f web/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            -t "$WEB" .

          docker build \
            -f api/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            -t "$API" ./api

          docker push "$WEB"
          docker push "$API"

          echo "### Imagenes publicadas" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: ${WEB}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${API}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cerrar sesion en GHCR
        if: always()
        run: docker logout ghcr.io

  security:
    name: security
    needs: package
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Definir imagenes del commit
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${SOURCE_SHA:0:7}"

          echo "WEB_IMAGE=ghcr.io/${OWNER}/perfil-web:${TAG}" >> "$GITHUB_ENV"
          echo "API_IMAGE=ghcr.io/${OWNER}/perfil-api:${TAG}" >> "$GITHUB_ENV"

      - name: Descargar imagenes de GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

          docker pull "$WEB_IMAGE"
          docker pull "$API_IMAGE"

      - name: Resumen de Trivy por severidad
        run: |
          set -euo pipefail

          {
            echo "### Trivy - Vulnerabilidades con correccion disponible"
            echo ""
            echo "| Imagen | CRITICAL | HIGH | MEDIUM | LOW | UNKNOWN |"
            echo "|---|---:|---:|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"

          for nombre in web api; do
            if [[ "$nombre" == "web" ]]; then
              imagen="$WEB_IMAGE"
            else
              imagen="$API_IMAGE"
            fi

            archivo="trivy-${nombre}.json"

            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache \
              aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
              image --scanners vuln --pkg-types os,library \
              --ignore-unfixed --format json "$imagen" > "$archivo"

            valores=()

            for nivel in CRITICAL HIGH MEDIUM LOW UNKNOWN; do
              cantidad=$(jq --arg nivel "$nivel" \
                '[.Results[]?.Vulnerabilities[]? | select(.Severity == $nivel)] | length' \
                "$archivo")

              valores+=("$cantidad")
            done

            printf '| %s | %s | %s | %s | %s | %s |\n' \
              "$nombre" "${valores[@]}" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Analizar ambas imagenes con Trivy
        run: |
          set -euo pipefail

          echo "Escaneando imagen WEB"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image --scanners vuln --pkg-types os,library \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "$WEB_IMAGE"

          echo "Escaneando imagen API"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image --scanners vuln --pkg-types os,library \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "$API_IMAGE"
      - name: Cerrar sesion de GHCR
        if: always()
        run: docker logout ghcr.io

  smoke:
    name: smoke
    needs: security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Definir imagen web del commit
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${SOURCE_SHA:0:7}"
          echo "WEB_IMAGE=ghcr.io/${OWNER}/perfil-web:${TAG}" >> "$GITHUB_ENV"

      - name: Descargar imagen desde GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

          docker pull "$WEB_IMAGE"

      - name: Iniciar contenedor web
        run: |
          docker run -d \
            --name perfil-smoke-ci \
            --add-host api:127.0.0.1 \
            -p 127.0.0.1:18080:8080 \
            "$WEB_IMAGE"

      - name: Verificar HTTP 200 y contenido HTML
        run: |
          set -euo pipefail

          listo=0

          for intento in {1..15}; do
            echo "Intento HTTP ${intento}/15"

            if CODIGO=$(curl \
                --fail --silent --show-error \
                --max-time 2 \
                --output smoke.html \
                --write-out "%{http_code}" \
                http://127.0.0.1:18080/ 2>smoke-error.log); then

              if [[ "$CODIGO" == "200" ]]; then
                listo=1
                break
              fi
            fi

            sleep 1
          done

          if [[ "$listo" -ne 1 ]]; then
            echo "ERROR: Nginx no respondio HTTP 200"
            cat smoke-error.log || true
            docker logs perfil-smoke-ci || true
            exit 1
          fi

          grep -Fq "Connie Duran" smoke.html

          echo "SMOKE OK: HTTP 200 y contenido correcto"
      - name: Limpiar contenedor
        if: always()
        run: |
          docker rm -f perfil-smoke-ci 2>/dev/null || true
          docker logout ghcr.io

  deploy-prod:
    name: deploy-prod
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar sitio en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: github-pages
