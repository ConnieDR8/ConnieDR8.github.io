name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Obtener código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Instalar dependencias del sitio
        run: npm ci

      - name: Construir sitio público
        run: npm run build

      - name: Revisar HTML con HTMLHint
        run: npm run lint:html

      - name: Instalar dependencias de API
        working-directory: api
        run: npm ci

      - name: Revisar API con ESLint
        working-directory: api
        run: npm run lint

      - name: Revisar Dockerfiles con Hadolint
        run: |
          for file in api/Dockerfile web/Dockerfile db/Dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.12.0-alpine < "$file"
          done

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site/

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Obtener codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Instalar dependencias del sitio
        run: npm ci

      - name: Construir sitio para pruebas
        run: npm run build

      - name: Ejecutar Vitest
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-report.json

      - name: Instalar dependencias de API
        working-directory: api
        run: npm ci

      - name: Ejecutar pruebas de API
        working-directory: api
        run: npm test -- --json --outputFile=jest-report.json

      - name: Integracion con Docker Compose
        env:
          COMPOSE_PROJECT_NAME: lab03integracion
        run: |
          set -euo pipefail

          export POSTGRES_DB=lab03
          export POSTGRES_USER=app_lab03
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"

          limpiar() {
            resultado=$?

            if [ "$resultado" -ne 0 ]; then
              echo "Fallo la integracion. Logs:"
              docker compose -f compose.yaml -f compose.ci.yaml logs --no-color db api web || true
            fi

            docker compose -f compose.yaml -f compose.ci.yaml down -v --remove-orphans || true
          }

          trap limpiar EXIT

          docker compose -f compose.yaml -f compose.ci.yaml up -d --wait --build
          node scripts/integracion-compose.mjs
      - name: Resumen de pruebas
        if: always()
        run: node scripts/resumen-pruebas.mjs

  package:
    name: package
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Obtener codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Autenticarse en GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Preparar Buildx para publicacion
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Definir etiquetas de imagenes
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${SOURCE_SHA:0:7}"
          echo "WEB_IMAGE=ghcr.io/${OWNER}/perfil-web:${TAG}" >> "$GITHUB_ENV"
          echo "API_IMAGE=ghcr.io/${OWNER}/perfil-api:${TAG}" >> "$GITHUB_ENV"

      - name: Publicar web con cache Buildx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: |
            type=gha,scope=lab03-web
            type=gha,scope=package-web
          cache-to: type=gha,scope=package-web,mode=max

      - name: Publicar API con cache Buildx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: |
            type=gha,scope=lab03-api
            type=gha,scope=package-api
          cache-to: type=gha,scope=package-api,mode=max

      - name: Resumen de imagenes publicadas
        run: |
          echo "### Imagenes publicadas" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: $WEB_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $API_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Cerrar sesion en GHCR
        if: always()
        run: docker logout ghcr.io

  security:
    name: security
    needs: package
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Obtener codigo para analisis
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Definir imagenes del commit
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${SOURCE_SHA:0:7}"

          echo "WEB_IMAGE=ghcr.io/${OWNER}/perfil-web:${TAG}" >> "$GITHUB_ENV"
          echo "API_IMAGE=ghcr.io/${OWNER}/perfil-api:${TAG}" >> "$GITHUB_ENV"

      - name: Descargar imagenes de GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

          docker pull "$WEB_IMAGE"
          docker pull "$API_IMAGE"

      - name: Analizar Semgrep y Trivy en paralelo
        run: |
          set -euo pipefail

          # Proceso 1: analisis estatico de JavaScript
          (
            docker run --rm \
              -v "$PWD:/src:ro" \
              -v "$RUNNER_TEMP:/out" \
              -w /src \
              semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b \
              semgrep scan --metrics=off \
              --config .semgrep.yml \
              --sarif --output /out/semgrep.sarif \
              api/app.js libro-de-visitas.js scripts

            test -s "$RUNNER_TEMP/semgrep.sarif"
          ) &
          pid_semgrep=$!

          # Proceso 2: resumen de vulnerabilidades de ambas imagenes
          (
            {
              echo "### Trivy - Vulnerabilidades con correccion disponible"
              echo ""
              echo "| Imagen | CRITICAL | HIGH | MEDIUM | LOW | UNKNOWN |"
              echo "|---|---:|---:|---:|---:|---:|"
            } >> "$GITHUB_STEP_SUMMARY"

            for nombre in web api; do
              if [[ "$nombre" == "web" ]]; then
                imagen="$WEB_IMAGE"
              else
                imagen="$API_IMAGE"
              fi

              archivo="trivy-${nombre}.json"

              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v trivy-cache:/root/.cache \
                -v "$PWD:/workspace:ro" \
                aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
                image --scanners vuln --pkg-types os,library \
                --ignore-unfixed --ignorefile /workspace/.trivyignore \
                --format json "$imagen" > "$archivo"

              valores=()

              for nivel in CRITICAL HIGH MEDIUM LOW UNKNOWN; do
                cantidad=$(jq --arg nivel "$nivel" \
                  '[.Results[]?.Vulnerabilities[]? | select(.Severity == $nivel)] | length' \
                  "$archivo")

                valores+=("$cantidad")
              done

              printf '| %s | %s | %s | %s | %s | %s |\n' \
                "$nombre" "${valores[@]}" >> "$GITHUB_STEP_SUMMARY"
            done
          ) &
          pid_trivy=$!

          # Esperar ambos procesos y detectar cualquier fallo
          fallo=0
          wait "$pid_semgrep" || fallo=1
          wait "$pid_trivy" || fallo=1

          if [[ "$fallo" -ne 0 ]]; then
            echo "ERROR: fallo Semgrep o el resumen Trivy"
            exit 1
          fi

          echo "Semgrep y resumen Trivy completados correctamente"

      - name: Generar reportes SARIF de Trivy
        run: |
          set -euo pipefail
          for servicio in web api; do
            if [[ "$servicio" == "web" ]]; then
              imagen="$WEB_IMAGE"
            else
              imagen="$API_IMAGE"
            fi

            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache \
              -v "$PWD:/workspace:ro" \
              -v "$RUNNER_TEMP:/out" \
              aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
              image --scanners vuln --pkg-types os,library \
              --ignore-unfixed --ignorefile /workspace/.trivyignore \
              --format sarif --output "/out/trivy-${servicio}.sarif" \
              "$imagen"

            test -s "$RUNNER_TEMP/trivy-${servicio}.sarif"
          done

      - name: Preparar reportes SARIF para una sola subida
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/sarif"

          for nombre in semgrep trivy-web trivy-api; do
            jq --arg categoria "$nombre" '
              .runs |= map(
                .automationDetails = (.automationDetails // {})
                | .automationDetails.id = ($categoria + "/")
              )
            ' "$RUNNER_TEMP/${nombre}.sarif" \
              > "$RUNNER_TEMP/sarif/${nombre}.sarif"

            jq -e '(.runs | length) >= 1' \
              "$RUNNER_TEMP/sarif/${nombre}.sarif" > /dev/null
          done

      - name: Publicar resultados SARIF en Code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          sarif_file: ${{ runner.temp }}/sarif
          wait-for-processing: false

      - name: Analizar ambas imagenes con Trivy
        run: |
          set -euo pipefail

          echo "Escaneando imagen WEB"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            -v "$PWD:/workspace:ro" \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image --scanners vuln --pkg-types os,library \
            --severity CRITICAL --ignore-unfixed --ignorefile /workspace/.trivyignore --exit-code 1 \
            "$WEB_IMAGE"

          echo "Escaneando imagen API"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            -v "$PWD:/workspace:ro" \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image --scanners vuln --pkg-types os,library \
            --severity CRITICAL --ignore-unfixed --ignorefile /workspace/.trivyignore --exit-code 1 \
            "$API_IMAGE"
      - name: Cerrar sesion de GHCR
        if: always()
        run: docker logout ghcr.io

  smoke:
    name: smoke
    needs: security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Definir imagen web del commit
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${SOURCE_SHA:0:7}"
          echo "WEB_IMAGE=ghcr.io/${OWNER}/perfil-web:${TAG}" >> "$GITHUB_ENV"

      - name: Descargar imagen desde GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

          docker pull "$WEB_IMAGE"

      - name: Iniciar contenedor web
        run: |
          docker run -d \
            --name perfil-smoke-ci \
            --add-host api:127.0.0.1 \
            -p 127.0.0.1:18080:8080 \
            "$WEB_IMAGE"

      - name: Verificar HTTP 200 y contenido HTML
        run: |
          set -euo pipefail

          listo=0

          for intento in {1..15}; do
            echo "Intento HTTP ${intento}/15"

            if CODIGO=$(curl \
                --fail --silent --show-error \
                --max-time 2 \
                --output smoke.html \
                --write-out "%{http_code}" \
                http://127.0.0.1:18080/ 2>smoke-error.log); then

              if [[ "$CODIGO" == "200" ]]; then
                listo=1
                break
              fi
            fi

            sleep 1
          done

          if [[ "$listo" -ne 1 ]]; then
            echo "ERROR: Nginx no respondio HTTP 200"
            cat smoke-error.log || true
            docker logs perfil-smoke-ci || true
            exit 1
          fi

          grep -Fq "Connie Duran" smoke.html

          echo "SMOKE OK: HTTP 200 y contenido correcto"
      - name: Limpiar contenedor
        if: always()
        run: |
          docker rm -f perfil-smoke-ci 2>/dev/null || true
          docker logout ghcr.io

  deploy-prod:
    name: deploy-prod
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar sitio en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: github-pages

      - name: Obtener codigo para verificacion
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Preparar Node.js para verificacion
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias de verificacion
        run: npm ci

      - name: Verificar produccion en Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verificar-produccion.mjs "$PAGE_URL"
