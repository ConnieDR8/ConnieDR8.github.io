name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Instalar dependencias del sitio
        run: npm ci

      - name: Construir sitio público
        run: npm run build

      - name: Revisar HTML con HTMLHint
        run: npm run lint:html

      - name: Instalar dependencias de API
        working-directory: api
        run: npm ci

      - name: Revisar API con ESLint
        working-directory: api
        run: npm run lint

      - name: Revisar Dockerfiles con Hadolint
        run: |
          for file in api/Dockerfile web/Dockerfile db/Dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.12.0-alpine < "$file"
          done

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site/

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Instalar dependencias del sitio
        run: npm ci

      - name: Construir sitio para pruebas
        run: npm run build

      - name: Ejecutar Vitest
        run: npm test

      - name: Instalar dependencias de API
        working-directory: api
        run: npm ci

      - name: Ejecutar pruebas de API
        working-directory: api
        run: npm test

  package:
    name: package
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Obtener codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Autenticarse en GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Construir y publicar imagenes
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${SOURCE_SHA:0:7}"

          WEB="ghcr.io/${OWNER}/perfil-web:${TAG}"
          API="ghcr.io/${OWNER}/perfil-api:${TAG}"

          echo "Publicando version ${TAG}"

          docker build \
            -f web/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            -t "$WEB" .

          docker build \
            -f api/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            -t "$API" ./api

          docker push "$WEB"
          docker push "$API"

          echo "### Imagenes publicadas" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: ${WEB}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${API}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cerrar sesion en GHCR
        if: always()
        run: docker logout ghcr.io

  security:
    name: security
    needs: package
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Definir imagenes del commit
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${SOURCE_SHA:0:7}"

          echo "WEB_IMAGE=ghcr.io/${OWNER}/perfil-web:${TAG}" >> "$GITHUB_ENV"
          echo "API_IMAGE=ghcr.io/${OWNER}/perfil-api:${TAG}" >> "$GITHUB_ENV"

      - name: Descargar imagenes de GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

          docker pull "$WEB_IMAGE"
          docker pull "$API_IMAGE"

      - name: Analizar imagen web con Trivy
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ env.WEB_IMAGE }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'

      - name: Analizar imagen API con Trivy
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ env.API_IMAGE }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'

      - name: Cerrar sesion de GHCR
        if: always()
        run: docker logout ghcr.io
